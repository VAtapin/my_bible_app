<!doctype html>
<html><head><meta charset="utf-8"><title>Bible Desktop share preview</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;overflow:hidden;background:#faf8f3;color:#173a5c;font-family:Arial,sans-serif}.photo{position:absolute;inset:0 auto 0 0;width:455px;height:630px;object-fit:cover;object-position:center 40%}.veil{position:absolute;inset:0 auto 0 0;width:480px;background:linear-gradient(90deg,transparent 73%,#faf8f3 100%)}main{position:absolute;left:492px;right:42px;top:48px}.brand{font:700 48px/1.1 Georgia,serif;letter-spacing:-1px;margin:0 0 20px}.gold{width:64px;height:3px;background:#ca9a3c;margin-bottom:22px}h1{font:400 30px/1.25 Georgia,serif;margin:0 0 18px}p{font-size:19px;line-height:1.5;margin:0 0 24px;max-width:630px}.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px}.feature{display:flex;align-items:center;gap:12px;border:1px solid #d7e3ec;border-radius:16px;padding:14px;background:white;font-size:18px;line-height:1.25;min-height:78px}.feature img{width:36px;height:36px;object-fit:contain}.footer{font-size:15px;color:#5c7590;margin-bottom:14px}.url{font-size:22px;font-weight:700;color:#315c83}
</style></head><body><img class="photo" src="/brand/welcome-church.png" alt=""><div class="veil"></div><main><div class="brand">Bible Desktop</div><div class="gold"></div><h1></h1><p></p><div class="features"></div><div class="footer"></div><div class="url"></div></main>
<script type="module">
import pages from '../config/social-pages.json'
const language = new URLSearchParams(location.search).get('lang') || 'ru'
const page = pages[language]
document.documentElement.lang = language
document.querySelector('h1').textContent = page.headline
document.querySelector('p').textContent = page.description
const icons = ['library','prayers','calendar','bookmarks']
page.features.forEach((label,index)=>{const feature=document.createElement('div');feature.className='feature';const icon=document.createElement('img');icon.src=`/app-icons/${icons[index]}.png`;icon.alt='';const text=document.createElement('span');text.textContent=label;feature.append(icon,text);document.querySelector('.features').append(feature)})
document.querySelector('.footer').textContent=page.footer
document.querySelector('.url').textContent=`bible-app.online/${language}`
</script></body></html>
